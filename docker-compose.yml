name: relay

x-api: &api
  image: relay-api
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-relay}:${POSTGRES_PASSWORD:-relay}@db:5432/${POSTGRES_DB:-relay}
    TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-relay}:${POSTGRES_PASSWORD:-relay}@db:5432/relay_test
    SEED_PATH: /data/seed.sql
    # Report parameters: pass-through with NO default. Unset stays unset in the container, so the
    # defaults live only in ReportSettings (an empty string would fail float parsing).
    REPORT_BASELINE_WEEKS:
    REPORT_MIN_HISTORY_WEEKS:
    REPORT_Z_MIN:
    REPORT_MIN_ABS:
    REPORT_MIN_BASELINE_MEDIAN:
  volumes:
    - ./backend:/app
    - ./data:/data:ro

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-relay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relay}
      POSTGRES_DB: ${POSTGRES_DB:-relay}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    <<: *api
    # Reuses the image built by the api service (one build, no tag race).
    pull_policy: never
    command: alembic upgrade head
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
